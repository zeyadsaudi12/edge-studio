<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول المسؤول | EDGE Studio Admin</title>
  <link rel="icon" type="image/png" href="assets/img/logo-blue.png">
  <script src="assets/js/site-ui.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style>
    body.login-page-body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top right, var(--bg-card) 0%, var(--bg-main) 100%);
    }

    .login-page-main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7rem 1.25rem 2rem;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 2.8rem 2.2rem;
      box-shadow: var(--card-shadow), var(--glow-strong);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      position: relative;
      z-index: 2;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-brand img {
      height: 48px;
      width: auto;
      margin: 0 auto 1rem;
    }

    .login-title {
      font-size: 1.4rem;
      margin-bottom: 0.3rem;
      color: var(--text-main);
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .login-input-group {
      position: relative;
      margin-bottom: 1.3rem;
    }

    .login-input-group i.field-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1rem;
    }

    .login-input {
      width: 100%;
      padding: 0.85rem 2.8rem 0.85rem 1rem;
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 16px;
      transition: all var(--transition-fast);
    }

    .login-input:focus {
      outline: none;
      border-color: var(--edge-blue-vibrant);
      box-shadow: 0 0 15px rgba(0, 86, 246, 0.4);
    }

    .password-toggle-btn {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1rem;
    }

    .password-toggle-btn:hover {
      color: var(--edge-cyan-glow);
    }

    .login-alert {
      padding: 0.8rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      margin-bottom: 1.2rem;
      display: none;
    }

    .login-alert.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #B42318;
      display: block;
    }

    .login-alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #067647;
      display: block;
    }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      font-size: 1.05rem;
      margin-top: 0.5rem;
    }

    .login-footer-links {
      text-align: center;
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border-subtle);
    }

    .login-footer-links a {
      color: var(--text-muted);
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: color var(--transition-fast);
    }

    .login-footer-links a:hover {
      color: var(--edge-cyan-glow);
    }

    @keyframes login-shake {
      20%, 60% { transform: translateX(7px); }
      40%, 80% { transform: translateX(-7px); }
    }

    .login-card.shake {
      animation: login-shake 0.35s ease-in-out;
    }

    html[data-theme="dark"] .login-alert.error {
      color: #FCA5A5;
    }

    html[data-theme="dark"] .login-alert.success {
      color: #6EE7B7;
    }

    @media (max-width: 768px) {
      body.login-page-body {
        padding-top: 0 !important;
      }

      .login-page-main {
        padding: 5.25rem 1rem 2rem;
      }
    }
  </style>
</head>
<body class="login-page-body">

  <!-- تأثيرات الإضاءة الانسيابية -->
  <div class="bg-ambient-glow">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
  </div>

  <header class="site-navbar">
    <div class="container nav-wrapper">
      <a href="/" class="brand-logo-container" title="EDGE Studio">
        <img src="assets/img/logo-blue.png" alt="EDGE Logo" class="brand-logo-img"
             data-theme-logo-light="assets/img/logo-blue.png" data-theme-logo-dark="assets/img/logo-white.png">
      </a>

      <nav class="nav-menu" id="nav-menu" aria-label="التنقل الرئيسي">
        <a href="/#hero" class="nav-link">الرئيسية</a>
        <details class="nav-dropdown nav-work-dropdown">
          <summary class="nav-link">الأعمال <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></summary>
          <div class="nav-dropdown-menu">
            <a href="/portfolio">معرض الأعمال بالكامل</a>
            <span class="nav-dropdown-label">تصفح حسب النوع</span>
            <a href="/portfolio?cat=posts">بوستات</a>
            <a href="/portfolio?cat=covers">أغلفة</a>
            <a href="/portfolio?cat=profiles">بروفايلات</a>
            <a href="/portfolio?cat=certificates">شهادات تقدير</a>
            <a href="/portfolio?cat=social">سوشيال ميديا</a>
            <a href="/portfolio?cat=print">مطبوعات وتغليف</a>
            <a href="/portfolio?cat=branding">هوية بصرية</a>
          </div>
        </details>
        <a href="/#pricing" class="nav-link">الأسعار</a>
        <details class="nav-dropdown">
          <summary class="nav-link">المزيد <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></summary>
          <div class="nav-dropdown-menu">
            <a href="/#why-us">لماذا EDGE؟</a>
            <a href="/#faq">الأسئلة الشائعة</a>
          </div>
        </details>
      </nav>

      <div class="nav-actions">
        <button type="button" class="theme-toggle-btn" data-theme-toggle
                aria-label="التبديل إلى الوضع الداكن" aria-pressed="false"></button>
        <a href="/#order-wizard-section" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-bolt"></i> اطلب الآن
        </a>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="فتح القائمة" aria-controls="nav-menu" aria-expanded="false">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="login-page-main">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/img/logo-white.png" alt="EDGE Studio Logo"
             data-theme-logo-light="assets/img/logo-blue.png" data-theme-logo-dark="assets/img/logo-white.png">
        <h2 class="login-title">تسجيل دخول الإدارة</h2>
        <p class="login-subtitle">منطقة محمية - مصرح للمسؤولين فقط</p>
      </div>

      <!-- رسائل التنبيه والخطأ -->
      <div class="login-alert" id="login-alert"></div>

      <form id="admin-login-form">
        <div class="login-input-group">
          <i class="fa-solid fa-user field-icon"></i>
          <input type="text" id="username" class="login-input" placeholder="اسم المستخدم (Username)" required autofocus autocomplete="username">
        </div>

        <div class="login-input-group">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="password" class="login-input" placeholder="كلمة المرور (Password)" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="إظهار كلمة المرور">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; font-size:0.85rem; color:var(--text-muted);">
          <label style="display:inline-flex; align-items:center; gap:0.4rem; cursor:pointer;">
            <input type="checkbox" id="remember-me" checked> تذكر الجلسة على هذا الجهاز
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-login" id="submit-login-btn">
          <i class="fa-solid fa-shield-halved"></i> تسجيل الدخول بأمان
        </button>
      </form>

      <div class="login-footer-links">
        <a href="/">
          <i class="fa-solid fa-arrow-right"></i> العودة للموقع الرئيسي
        </a>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('admin-login-form');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password-btn');
      const loginAlert = document.getElementById('login-alert');
      const submitBtn = document.getElementById('submit-login-btn');

      function showError(message, invalidCredentials = false) {
        loginAlert.className = 'login-alert error';
        loginAlert.textContent = message;
        loginAlert.style.display = 'block';
        if (invalidCredentials) {
          const card = document.querySelector('.login-card');
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
        }
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> تسجيل الدخول بأمان';
      }

      // إظهار وإخفاء كلمة المرور
      togglePasswordBtn?.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordBtn.innerHTML = isPassword ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
      });

      // التحقق إن كان المستخدم مسجل دخول بالفعل
      const existingToken = localStorage.getItem('edge_admin_token') || sessionStorage.getItem('edge_admin_token');
      if (existingToken) {
        fetch('/api/auth/verify', {
          headers: { 'Authorization': 'Bearer ' + existingToken }
        })
        .then(async res => {
          if (res.status === 401 || res.status === 403) {
            localStorage.removeItem('edge_admin_token');
            localStorage.removeItem('edge_admin_user');
            sessionStorage.removeItem('edge_admin_token');
            sessionStorage.removeItem('edge_admin_user');
            return null;
          }
          return res.ok ? res.json() : null;
        })
        .then(data => {
          if (data?.success && data.valid) {
            window.location.href = 'admin';
          }
        })
        .catch(() => {});
      }

      // إرسال طلب تسجيل الدخول
      loginForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        loginAlert.className = 'login-alert';
        loginAlert.textContent = '';
        loginAlert.style.display = 'none';

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const rememberMe = document.getElementById('remember-me').checked;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();

          if (res.ok && data.success && data.token) {
            loginAlert.className = 'login-alert success';
            loginAlert.textContent = 'تم تسجيل الدخول بنجاح! جاري تحويلك إلى لوحة التحكم...';
            loginAlert.style.display = 'block';

            if (rememberMe) {
              sessionStorage.removeItem('edge_admin_token');
              sessionStorage.removeItem('edge_admin_user');
              localStorage.setItem('edge_admin_token', data.token);
              localStorage.setItem('edge_admin_user', JSON.stringify(data.admin));
            } else {
              localStorage.removeItem('edge_admin_token');
              localStorage.removeItem('edge_admin_user');
              sessionStorage.setItem('edge_admin_token', data.token);
              sessionStorage.setItem('edge_admin_user', JSON.stringify(data.admin));
            }

            setTimeout(() => {
              window.location.href = 'admin';
            }, 800);
          } else {
            showError(data.message || 'تعذر تسجيل الدخول. يرجى المحاولة مجدداً.', res.status === 401);
          }
        } catch (err) {
          showError('تعذر الاتصال بالخادم. تحقق من اتصالك وحاول مرة أخرى.');
        }
      });
    });
  </script>
</body>
</html>
