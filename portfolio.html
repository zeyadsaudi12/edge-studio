<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض التصاميم الشامل | EDGE Studio Portfolio</title>
  <meta name="description" content="تصفح جميع أعمال وتصاميم استوديو EDGE الإبداعية: سوشيال ميديا، مطبوعات وتغليف، وهويات بصرية كاملة.">
  <link rel="icon" type="image/png" href="assets/img/logo-blue.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- تأثيرات الإضاءة الخلفية -->
  <div class="bg-ambient-glow">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>
  </div>

  <!-- الهيدر العلوي -->
  <header class="site-navbar">
    <div class="container nav-wrapper">
      <a href="/" class="brand-logo-container" title="EDGE Studio">
        <img src="assets/img/logo-white.png" alt="EDGE Logo" class="brand-logo-img">
      </a>

      <div class="nav-actions">
        <a href="/" class="btn btn-outline btn-sm">
          <i class="fa-solid fa-house"></i> العودة للرئيسية
        </a>
        <a href="/#order-wizard-section" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-paper-plane"></i> اطلب تصميمك الآن
        </a>
      </div>
    </div>
  </header>

  <!-- جسم المعرض الشامل -->
  <main style="padding: 8rem 0 5rem;">
    <div class="container">
      <div class="section-header" style="margin-bottom:2.5rem;">
        <div class="section-badge">
          <i class="fa-solid fa-layer-group"></i> الأرشيف الإبداعي الشامل
        </div>
        <h1 class="section-title">جميع مشاريع وتصاميم الاستوديو</h1>
        <p class="section-subtitle">
          تصفح كافة أعمالنا وتصاميمنا المنفذة لعملائنا في مختلف المجالات، وبإمكانك تصفيتها حسب تخصص مشروعك
        </p>
      </div>

      <!-- أزرار تبديل الأقسام -->
      <div class="portfolio-tabs" style="margin-bottom:2.5rem;">
        <button class="tab-btn active" data-filter="all">
          <i class="fa-solid fa-border-all"></i> جميع الأعمال (<span id="count-all">0</span>)
        </button>
        <button class="tab-btn" data-filter="social">
          <i class="fa-solid fa-share-nodes"></i> سوشيال ميديا (<span id="count-social">0</span>)
        </button>
        <button class="tab-btn" data-filter="print">
          <i class="fa-solid fa-print"></i> مطبوعات وتغليف (<span id="count-print">0</span>)
        </button>
        <button class="tab-btn" data-filter="branding">
          <i class="fa-solid fa-wand-magic-sparkles"></i> هوية بصرية (<span id="count-branding">0</span>)
        </button>
      </div>

      <!-- شبكة عرض الأعمال الشاملة -->
      <div class="portfolio-grid" id="full-portfolio-grid">
        <div style="grid-column: 1 / -1; text-align:center; padding:3rem; color:var(--text-dim);">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--edge-cyan-glow); margin-bottom:0.8rem; display:block;"></i>
          جاري تحميل معرض المشاريع...
        </div>
      </div>
    </div>
  </main>

  <!-- نافذة المعاينة السريعة المنبثقة -->
  <div class="modal-overlay" id="project-modal">
    <div class="modal-dialog">
      <button class="modal-close-btn" id="modal-close-btn" aria-label="إغلاق المعاينة">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="modal-content-wrap" id="modal-dynamic-content">
        <!-- تتولد ديناميكياً -->
      </div>
    </div>
  </div>

  <!-- الفوتر -->
  <footer class="site-footer" style="padding: 2.5rem 0; border-top: 1px solid var(--border-subtle); text-align: center;">
    <div class="container">
      <p style="color:var(--text-muted); font-size:0.9rem; margin:0;">
        جميع الحقوق محفوظة © <span id="year-copy">2026</span> - استوديو <strong>EDGE Creative</strong>
      </p>
    </div>
  </footer>

  <!-- كود تشغيل صفحة المعرض الشامل -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('full-portfolio-grid');
      const tabs = document.querySelectorAll('.portfolio-tabs .tab-btn');
      const projectModal = document.getElementById('project-modal');
      const modalCloseBtn = document.getElementById('modal-close-btn');
      const modalBody = document.getElementById('modal-dynamic-content');

      // قراءة الفلتر الافتراضي من رابط الصفحة (مثلاً: portfolio.html?cat=social)
      const urlParams = new URLSearchParams(window.location.search);
      let currentFilter = urlParams.get('cat') || 'all';

      // جلب المشاريع من السيرفر أو الكاش المحلي
      let allProjects = [];
      try {
        const res = await fetch('/api/projects');
        const data = await res.json();
        if (data.success && Array.isArray(data.projects) && data.projects.length > 0) {
          allProjects = data.projects.map(p => ({
            id: p.projectId || p._id || p.id,
            projectId: p.projectId || p._id || p.id,
            title: p.title,
            category: p.category,
            categoryName: p.categoryName || 'تصميم إبداعي',
            client: p.client || 'عميل EDGE',
            year: p.year || '',
            image: p.image,
            description: p.description || '',
            tags: p.tags || [],
            features: p.features || [],
            showInHome: p.showInHome !== false
          }));
          localStorage.setItem('edge_custom_projects', JSON.stringify(allProjects));
        }
      } catch (e) {}

      if (allProjects.length === 0) {
        const cached = JSON.parse(localStorage.getItem('edge_custom_projects') || '[]');
        allProjects = cached.map(p => ({
          ...p,
          id: p.id || p.projectId || p._id
        }));
      }

      // تحديث أعداد الأزرار
      const total = allProjects.length;
      const socialCount = allProjects.filter(p => p.category === 'social').length;
      const printCount = allProjects.filter(p => p.category === 'print').length;
      const brandCount = allProjects.filter(p => p.category === 'branding').length;

      document.getElementById('count-all').textContent = total;
      document.getElementById('count-social').textContent = socialCount;
      document.getElementById('count-print').textContent = printCount;
      document.getElementById('count-branding').textContent = brandCount;

      function render(filter) {
        if (!grid) return;
        grid.innerHTML = '';

        const list = filter === 'all' 
          ? allProjects 
          : allProjects.filter(p => p.category === filter);

        if (list.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align:center; padding:4rem; background:var(--bg-card); border:1px dashed var(--border-subtle); border-radius:16px; color:var(--text-muted);">
              <i class="fa-solid fa-folder-open fa-3x" style="margin-bottom:1rem; opacity:0.4; color:var(--edge-cyan-glow); display:block;"></i>
              لا توجد تصاميم في هذا القسم حالياً.
            </div>
          `;
          return;
        }

        list.forEach(item => {
          const card = document.createElement('div');
          card.className = 'portfolio-card';

          const tagsHtml = (item.tags || []).map(t => `<span class="tag-badge">#${t}</span>`).join(' ');

          card.innerHTML = `
            <div class="portfolio-thumb-wrap">
              <img src="${item.image}" alt="${item.title}" class="portfolio-thumb" loading="lazy">
              <div class="portfolio-overlay">
                <button class="overlay-btn view-project-btn" data-id="${item.projectId || item._id || item.id}">
                  <i class="fa-solid fa-expand"></i> معاينة التصميم
                </button>
              </div>
            </div>
            <div class="portfolio-body">
              <div class="portfolio-meta">
                <span class="portfolio-cat-tag">${item.categoryName || item.category}</span>
                <span class="portfolio-year">${item.year || ''}</span>
              </div>
              <h3 class="portfolio-title">${item.title}</h3>
              <p style="font-size:0.85rem; color:var(--text-accent); margin:0.3rem 0;"><i class="fa-solid fa-user-tie"></i> ${item.client || 'عميل EDGE'}</p>
              <div class="portfolio-tags">${tagsHtml}</div>
            </div>
          `;
          grid.appendChild(card);
        });

        document.querySelectorAll('.view-project-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const item = allProjects.find(p => (p.projectId || p._id || p.id) == id);
            if (item) openModal(item);
          });
        });
      }

      function openModal(item) {
        modalBody.innerHTML = `
          <div class="modal-img-container">
            <img src="${item.image}" alt="${item.title}">
          </div>
          <div class="modal-details-body">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
              <span class="section-badge" style="font-size:0.8rem; padding:0.25rem 0.75rem;">${item.categoryName || item.category}</span>
              <span style="color:var(--text-dim); font-size:0.85rem;"><i class="fa-regular fa-calendar"></i> سنة التنفيذ: ${item.year || ''}</span>
            </div>
            <h2 style="font-size:1.45rem; margin-bottom:0.4rem; color:#fff;">${item.title}</h2>
            <p style="color:var(--text-accent); font-weight:600; font-size:0.95rem; margin-bottom:1rem;"><i class="fa-solid fa-user-tie"></i> العميل: ${item.client || 'عميل EDGE'}</p>
            <div style="display:flex; gap:0.8rem; flex-wrap:wrap; margin-top:0.5rem;">
              <a href="/#order-wizard-section" class="btn btn-primary btn-sm" style="flex:1;">
                <i class="fa-solid fa-paper-plane"></i> طلب تصميم مشابه
              </a>
              <button class="btn btn-outline btn-sm" id="modal-close-action">
                إغلاق المعاينة
              </button>
            </div>
          </div>
        `;
        projectModal.classList.add('active');
        document.body.style.overflow = 'hidden';
        document.getElementById('modal-close-action')?.addEventListener('click', closeModal);
      }

      function closeModal() {
        projectModal.classList.remove('active');
        document.body.style.overflow = '';
      }

      modalCloseBtn?.addEventListener('click', closeModal);
      projectModal?.addEventListener('click', (e) => {
        if (e.target === projectModal) closeModal();
      });

      // تنشيط التاب المحدد
      tabs.forEach(tab => {
        const f = tab.getAttribute('data-filter');
        if (f === currentFilter) {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
        }

        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const filter = tab.getAttribute('data-filter');
          render(filter);
        });
      });

      render(currentFilter);
    });
  </script>
</body>
</html>
